[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mercury-qt"
version = "0.3.1"
description = "PySide6 desktop client for monitoring and controlling the Mercury HF modem"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Rhizomatica Developers", email = "info@rhizomatica.org" },
]
keywords = ["mercury", "hf", "modem", "pyside6", "qt", "websocket"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
]
dependencies = [
  "pyside6",
  "numpy",
]

[project.urls]
Homepage = "https://github.com/Rhizomatica/mercury-qt"

[project.scripts]
mercury-qt = "app:main"

[tool.setuptools]
py-modules = ["app", "windows_bundle_entry"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*"]
namespaces = true

[tool.setuptools.package-data]
"apps.mercury_qt" = ["assets/styles/*.qss"]
